services:
  telegram-checkin:
    build: .
    restart: unless-stopped
    init: true
    ipc: host
    env_file:
      - path: .env
        required: false
    environment:
      CONFIG_PATH: /app/config.yaml
      DATA_DIR: /data
      LOGIN_HOST: 0.0.0.0
      LOGIN_PORT: 18080
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - telegram-checkin-data:/data

volumes:
  telegram-checkin-data:
